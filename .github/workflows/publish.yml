# .github/workflows/publish.yml
name: 发布

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: 发布到 NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: 获取 pnpm 存储目录
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: 设置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 测试
        run: pnpm test:run

      - name: 检查是否为预发布版本
        id: prerelease
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=beta" >> $GITHUB_OUTPUT
            echo "📦 Detected pre-release version"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "📦 Detected stable release version"
          fi

      - name: 发布到 NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.prerelease.outputs.npm_tag }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          pnpm publish --provenance --tag "${NPM_TAG}" --no-git-checks
          echo "✅ Published to NPM with tag: ${NPM_TAG}"

      - name: 创建 GitHub Release
        uses: actions/github-script@v7
        env:
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const isPrerelease = process.env.IS_PRERELEASE === 'true';
            const repoName = process.env.REPO_NAME;

            console.log(`Creating GitHub Release for ${tag}`);

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              prerelease: isPrerelease
            });

            console.log(`✅ Release created: ${release.html_url}`);

            const npmTag = isPrerelease ? 'beta' : 'latest';

            core.summary
              .addHeading('🎉 Release Published')
              .addLink(tag, release.html_url)
              .addRaw(`\n\n**NPM Package**: [\`${repoName}@${tag.substring(1)}\`](https://www.npmjs.com/package/${repoName})`)
              .addRaw(`\n\n**NPM Tag**: \`${npmTag}\``)
              .write();

      - name: 在 PR 上评论
        uses: actions/github-script@v7
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const repoName = process.env.REPO_NAME;

            // 查找对应的 release PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });

            const releasePR = prs.find(pr =>
              pr.merged_at &&
              pr.title.includes(`release ${tag}`)
            );

            if (releasePR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: releasePR.number,
                body: `🎉 **Release ${tag} has been published!**\n\n- 📦 [NPM Package](https://www.npmjs.com/package/${repoName})\n- 📝 [GitHub Release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag})`
              });
            }
