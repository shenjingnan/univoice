name: CI Pipeline

# 触发条件：只在PR到main分支时运行CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # CI 阶段 - 完整的代码质量和测试检查
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['24']

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 启用 Corepack
      run: corepack enable

    - name: 安装 pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.0.0

    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: 安装依赖
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 2
        retry_on: error
        command: pnpm install --frozen-lockfile

    # 代码质量检查
    - name: 代码检查
      run: pnpm run lint

    # 构建（必须在类型检查之前，因为类型定义文件需要通过构建生成）
    - name: 构建
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 2
        retry_on: error
        command: pnpm run build

    - name: 类型检查
      run: pnpm run build

    - name: 拼写检查
      run: pnpm run spell

    # 测试
    - name: 测试
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 2
        retry_on: error
        command: pnpm run test:run

    # 上传覆盖率（仅 Ubuntu）
    - name: 上传覆盖率报告
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: |
          ./coverage/lcov.info
        flags: unittests
        name: codecov-${{ matrix.os }}-node${{ matrix.node-version }}
        fail_ci_if_error: true
        verbose: true

    # 上传构建产物
    - name: 上传覆盖率报告
      uses: actions/upload-artifact@v4
      if: always() && matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report-${{ matrix.os }}-node${{ matrix.node-version }}
        path: |
          coverage/
        retention-days: 30

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts-${{ matrix.os }}-node${{ matrix.node-version }}
        path: |
          dist/
        retention-days: 7
