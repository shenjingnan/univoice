# .github/workflows/create-tag.yml
name: 创建标签

on:
  push:
    branches:
      - main
    paths:
      - "package.json"

jobs:
  create-tag:
    name: 创建 Git 标签
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 需要获取前一个 commit 来比较

      - name: 检查版本是否变更
        id: version
        run: |
          # 获取当前版本
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # 获取上一个 commit 的版本
          git checkout HEAD~1 -- package.json
          PREVIOUS_VERSION=$(node -p "require('./package.json').version")
          git checkout HEAD -- package.json

          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 版本已变更: $PREVIOUS_VERSION → $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 版本未变更"
          fi

      - name: 检查标签是否存在
        id: tag-check
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ 标签 $TAG 已存在"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ 标签 $TAG 不存在，将创建"
          fi

      - name: 创建并推送标签
        if: steps.version.outputs.changed == 'true' && steps.tag-check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.current }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "发布 $TAG"
          git push origin "$TAG"

          echo "✅ 已创建并推送标签: $TAG"

      - name: 摘要
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "### 🏷️ 标签已创建" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: v${{ steps.version.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          echo "- **上一版本**: v${{ steps.version.outputs.previous }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "发布工作流将自动触发。" >> $GITHUB_STEP_SUMMARY
