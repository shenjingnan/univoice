[package]
name = "univoice"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unified Voice SDK for TTS and ASR (Rust edition)"
license = "MIT"

[dependencies]
# CLI 框架
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 错误处理
thiserror = "2"
anyhow = "1"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# 示例依赖
dotenvy = "0.15"                                        # .env 文件加载

# --- ASR 依赖 ---
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }    # WebSocket 客户端
tungstenite = "0.24"                                    # WebSocket 协议底层
futures-util = "0.3"                                    # 异步流处理
flate2 = "1"                                            # Gzip 压缩/解压
uuid = { version = "1", features = ["v4"] }             # UUID 生成
http = "1"                                              # HTTP 头操作
bytes = "1"                                             # 字节缓冲区
url = "2"                                               # URL 解析
tokio-stream = "0.1"                                    # 流式扩展
async-trait = "0.1"                                     # 异步 trait
async-stream = "0.3"                                    # 流式宏

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
lto = "thin"
